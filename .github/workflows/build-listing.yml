name: Build VPM Listing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-listing.yml'
      - '.github/workflows/auto-version-bump.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-check-{0}', github.event.pull_request.number) || 'pages' }}
  queue: max

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/auto-version-bump.yml
    with:
      source: ${{ github.event_name == 'push' && github.sha || '' }}

  build:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build VPM Listing
        run: |
          mkdir -p _site

          # Copy source.json
          cp source.json _site/

          # Copy website files
          if [ -d "Website" ]; then
            cp -r Website/* _site/
          fi

          # Create packages directory
          mkdir -p _site/packages

          # Initialize index.json
          cat > _site/index.json << 'INDEXEOF'
          {
            "name": "s4na VPM Repository",
            "id": "com.s4na.vpm",
            "url": "https://s4na.github.io/vpm/index.json",
            "author": "s4na",
            "packages": {}
          }
          INDEXEOF

          # Process each package
          for pkg_dir in Packages/*/; do
            if [ -f "${pkg_dir}package.json" ]; then
              pkg_name=$(jq -r '.name' "${pkg_dir}package.json")
              pkg_version=$(jq -r '.version' "${pkg_dir}package.json")

              echo "Processing $pkg_name@$pkg_version"

              # Create zip
              mkdir -p "_site/packages/${pkg_name}"
              cd "$pkg_dir"
              zip -r "../../_site/packages/${pkg_name}/${pkg_name}-${pkg_version}.zip" . -x "*.meta"
              cd ../..

              # Read package.json and add url
              pkg_json=$(cat "${pkg_dir}package.json")
              pkg_json=$(echo "$pkg_json" | jq --arg url "https://s4na.github.io/vpm/packages/${pkg_name}/${pkg_name}-${pkg_version}.zip" '. + {url: $url}')

              # Update index.json
              index_json=$(cat _site/index.json)
              index_json=$(echo "$index_json" | jq --arg name "$pkg_name" --arg version "$pkg_version" --argjson pkg "$pkg_json" '.packages[$name].versions[$version] = $pkg')
              echo "$index_json" > _site/index.json
            fi
          done

          # Add third-party packages without repackaging their release ZIPs.
          node <<'NODE'
          const fs = require('node:fs');
          const listingPath = '_site/index.json';
          const listing = JSON.parse(fs.readFileSync(listingPath, 'utf8'));
          const external = JSON.parse(fs.readFileSync('external-packages.json', 'utf8'));
          for (const [name, pkg] of Object.entries(external)) {
            if (Object.hasOwn(listing.packages, name)) {
              throw new Error(`Duplicate VPM package: ${name}`);
            }
            listing.packages[name] = pkg;
          }
          fs.writeFileSync(listingPath, JSON.stringify(listing, null, 2) + '\n');
          NODE

          echo "Build complete!"
          cat _site/index.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
