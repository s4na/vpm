name: Prepare VPM release

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: false
        default: ''
    outputs:
      sha:
        value: ${{ jobs.prepare.outputs.sha }}

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select the versioned commit
        id: release
        env:
          SOURCE: ${{ inputs.source }}
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
        run: |
          sha=$(python3 scripts/prepare-vpm-release.py --source "$SOURCE")
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
